<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PostPock</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preload" href="./fonts/PlusJakartaSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="./fonts/ResourceHanRoundedCN-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script>
  // paint the last theme before anything loads, so a dark library never flashes light
  try { var t = localStorage.getItem('postpock.ui.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
